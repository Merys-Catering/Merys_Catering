<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de reservas | Mery's Catering</title>
<link rel="icon" type="image/png" href="img/01_icono_pagina_web.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#001e53;--rojo:#b90000;--mist:#eef4fc;--muted:#5b667a;--line:#dfe6f2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--navy);background:var(--mist);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
header{display:flex;align-items:center;gap:1rem;padding:.6rem 1.4rem;background:#fff;border-bottom:4px solid var(--rojo)}
header img{height:46px}
header h1{font-size:1.15rem;font-weight:800}
header .espacio{flex:1}
.salir{background:none;border:1px solid var(--line);border-radius:8px;padding:.4rem .9rem;color:var(--navy)}
.card{background:#fff;border-radius:14px;padding:1.2rem;box-shadow:0 4px 14px rgba(0,30,83,.06)}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:.8rem}
.btn{background:var(--rojo);color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:800}
.btn.alt{background:var(--navy)}
input,select,textarea{width:100%;padding:.5rem .65rem;border:1px solid #c9cfdc;border-radius:8px;background:#fff;color:var(--navy)}
label{display:grid;gap:.25rem;font-size:.85rem;font-weight:700}
.login{display:grid;place-items:center;min-height:75vh;padding:1.4rem}
.login form{width:min(380px,100%);display:grid;gap:.9rem}
#panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:1.2rem;padding:1.2rem;max-width:1300px;margin:0 auto;align-items:start}
.columna{display:grid;gap:1.2rem}
.filtros{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip i{font-style:normal;opacity:.8;margin-left:.2rem}
#buscar{margin-bottom:.8rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.55rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:.8rem}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--mist)}
tbody tr.sel{background:#e2ebf8}
small{color:var(--muted)}
.e-pendiente{--c:#b7791f}.e-cotizada{--c:#1f5fb4}.e-confirmada{--c:#1e8e4e}.e-cancelada{--c:#6b7280}
.badge{background:var(--c);color:#fff;border-radius:999px;padding:.15rem .6rem;font-size:.78rem;font-weight:800;white-space:nowrap}
.cabecera{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem}
.codigo{font-size:1.3rem;font-weight:800}
dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem .9rem;font-size:.92rem}
dt{color:var(--muted);font-weight:700}
dd{word-break:break-word}
dd a{color:var(--navy)}
h3{font-size:.9rem;margin:1rem 0 .45rem}
.estados{display:flex;flex-wrap:wrap;gap:.4rem}
.estados button{background:#fff;border:2px solid var(--c);color:var(--c);border-radius:999px;padding:.3rem .8rem;font-weight:800;text-transform:capitalize}
.estados button.activo{background:var(--c);color:#fff}
.fila{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.fila label{flex:1;min-width:130px}
.disp{border-radius:10px;padding:.7rem .9rem;margin:.9rem 0 .5rem;font-weight:800}
.ok{background:#e6f5ec;color:#1e6b3c}
.no{background:#fbeaea;color:#8a1c1c}
.resumen{list-style:none;display:grid;gap:.25rem;font-size:.92rem}
.notas{margin-top:1rem;display:grid;gap:.5rem}
.msg{color:#8a1c1c;font-size:.9rem;min-height:1.2em}
.vacio{color:var(--muted)}
@media(max-width:900px){#panel{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <img src="img/02_logo_principal.png" alt="Mery's Catering">
  <h1>Panel de reservas</h1>
  <span class="espacio"></span>
  <button class="salir hidden" id="salir">Salir</button>
</header>

<div class="login" id="login">
  <form class="card" id="form-login">
    <h2>Entrar al panel</h2>
    <label>Correo<input type="email" id="l-correo" required autocomplete="username"></label>
    <label>Contraseña<input type="password" id="l-clave" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Entrar</button>
    <p class="msg" id="l-msg"></p>
  </form>
</div>

<main id="panel" class="hidden">
  <section class="card">
    <h2>Solicitudes</h2>
    <div class="filtros">
      <button class="chip on" data-f="todas">Todas <i id="n-todas"></i></button>
      <button class="chip" data-f="pendiente">Pendientes <i id="n-pendiente"></i></button>
      <button class="chip" data-f="cotizada">Cotizadas <i id="n-cotizada"></i></button>
      <button class="chip" data-f="confirmada">Confirmadas <i id="n-confirmada"></i></button>
      <button class="chip" data-f="cancelada">Canceladas <i id="n-cancelada"></i></button>
    </div>
    <input type="search" id="buscar" placeholder="Buscar por código, nombre, correo o teléfono">
    <div id="lista"></div>
  </section>

  <div class="columna">
    <section class="card">
      <h2>Revisar disponibilidad</h2>
      <form class="fila" id="form-disp">
        <label>Fecha<input type="date" id="d-fecha" required></label>
        <label>Personas<input type="number" id="d-personas" min="1" value="10" required></label>
        <button class="btn alt" type="submit">Revisar</button>
      </form>
      <div id="d-res"></div>
    </section>
    <section class="card" id="detalle"><p class="vacio">Selecciona una solicitud de la lista.</p></section>
  </div>
</main>

<script>
// ===== CONFIGURACIÓN: los mismos valores que EVENTOS_MERY.html =====
const CONFIG = {
  supabaseUrl: 'https://vlrhydgsjholcngvpybm.supabase.co/rest/v1/',   // ej. https://xxxx.supabase.co
  supabaseKey: 'sb_publishable_kSMPT9LRQIfTvT_eeRdrrw_Y1haBcqN'    // clave pública "anon"
};

const ESTADOS = ['pendiente', 'cotizada', 'confirmada', 'cancelada'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let sesion = JSON.parse(sessionStorage.getItem('sesion') || 'null');
let datos = [], filtro = 'todas', seleccionado = null;

async function api(ruta, opciones = {}) {
  const r = await fetch(CONFIG.supabaseUrl + ruta, {
    ...opciones,
    headers: { apikey: CONFIG.supabaseKey, Authorization: `Bearer ${sesion.token}`, 'Content-Type': 'application/json' }
  });
  if (r.status === 401 || r.status === 403) { salir(); throw new Error('La sesión venció. Entra de nuevo.'); }
  if (!r.ok) throw new Error(await r.text());
  const texto = await r.text();
  return texto ? JSON.parse(texto) : null;
}

// Inicio de sesión
$('#form-login').onsubmit = async e => {
  e.preventDefault();
  $('#l-msg').textContent = '';
  try {
    const r = await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: CONFIG.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#l-correo').value, password: $('#l-clave').value })
    });
    if (!r.ok) throw new Error();
    const j = await r.json();
    sesion = { token: j.access_token };
    sessionStorage.setItem('sesion', JSON.stringify(sesion));
    iniciar();
  } catch {
    $('#l-msg').textContent = CONFIG.supabaseUrl ? 'Correo o contraseña incorrectos.' : 'Falta configurar supabaseUrl y supabaseKey.';
  }
};

function iniciar() {
  $('#login').classList.add('hidden');
  $('#panel').classList.remove('hidden');
  $('#salir').classList.remove('hidden');
  $('#d-fecha').value ||= new Date().toISOString().slice(0, 10);
  cargar();
}

function salir() {
  sessionStorage.removeItem('sesion');
  sesion = null;
  $('#panel').classList.add('hidden');
  $('#salir').classList.add('hidden');
  $('#login').classList.remove('hidden');
}
$('#salir').onclick = salir;

// Solicitudes
async function cargar() {
  try {
    datos = await api('/rest/v1/reservas?select=*&order=fecha.asc,creada_en.desc');
    pintarLista();
    pintarDetalle();
  } catch (e) {
    if (sesion) $('#lista').innerHTML = `<p class="msg">No se pudieron cargar las solicitudes: ${esc(e.message)}</p>`;
  }
}

function pintarLista() {
  const q = $('#buscar').value.trim().toLowerCase();
  ESTADOS.forEach(e => $('#n-' + e).textContent = datos.filter(r => r.estado === e).length);
  $('#n-todas').textContent = datos.length;
  const filas = datos.filter(r =>
    (filtro === 'todas' || r.estado === filtro) &&
    (!q || [r.codigo, r.nombre, r.correo, r.telefono].join(' ').toLowerCase().includes(q)));
  $('#lista').innerHTML = filas.length
    ? `<table>
        <thead><tr><th>Código</th><th>Fecha</th><th>Tipo</th><th>Personas</th><th>Estado</th></tr></thead>
        <tbody>${filas.map(r => `
          <tr data-id="${r.id}" class="${r.id === seleccionado ? 'sel' : ''}">
            <td><b>${esc(r.codigo)}</b><br><small>${esc(r.nombre)}</small></td>
            <td>${esc(r.fecha)}</td><td>${esc(r.tipo)}</td><td>${esc(r.invitados)}</td>
            <td><span class="badge e-${r.estado}">${r.estado}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>`
    : '<p class="vacio">No hay solicitudes con ese filtro.</p>';
}

$$('.chip').forEach(c => c.onclick = () => {
  filtro = c.dataset.f;
  $$('.chip').forEach(x => x.classList.toggle('on', x === c));
  pintarLista();
});
$('#buscar').oninput = pintarLista;
$('#lista').onclick = e => {
  const fila = e.target.closest('tr[data-id]');
  if (!fila) return;
  seleccionado = Number(fila.dataset.id);
  pintarLista();
  pintarDetalle();
};

// Detalle de una solicitud
function pintarDetalle() {
  const r = datos.find(x => x.id === seleccionado);
  if (!r) { $('#detalle').innerHTML = '<p class="vacio">Selecciona una solicitud de la lista.</p>'; return; }
  const tel = String(r.telefono).replace(/\D/g, '');
  $('#detalle').innerHTML = `
    <div class="cabecera"><span class="codigo">${esc(r.codigo)}</span><span class="badge e-${r.estado}">${r.estado}</span></div>
    <dl>
      <dt>Nombre</dt><dd>${esc(r.nombre)}</dd>
      <dt>Correo</dt><dd><a href="mailto:${esc(r.correo)}">${esc(r.correo)}</a></dd>
      <dt>Teléfono</dt><dd><a href="tel:${tel}">${esc(r.telefono)}</a></dd>
      <dt>Tipo</dt><dd>${esc(r.tipo)}</dd>
      <dt>Fecha</dt><dd>${esc(r.fecha)}</dd>
      <dt>Personas</dt><dd>${esc(r.invitados)}</dd>
      <dt>Lugar</dt><dd>${esc(r.lugar || '—')}</dd>
      <dt>Mensaje</dt><dd>${esc(r.mensaje || '—')}</dd>
    </dl>
    <h3>Estado</h3>
    <div class="estados">${ESTADOS.map(e => `<button class="e-${e}${e === r.estado ? ' activo' : ''}" data-estado="${e}">${e}</button>`).join('')}</div>
    <h3>Disponibilidad para esta solicitud</h3>
    <div id="d-det"></div>
    <div class="notas">
      <label>Notas internas<textarea id="notas" rows="3">${esc(r.notas || '')}</textarea></label>
      <button class="btn alt" id="guardar-notas">Guardar notas</button>
    </div>
    <p class="msg" id="det-msg"></p>`;
  revisar(r.fecha, r.invitados, $('#d-det'), r.id);
}

$('#detalle').onclick = e => {
  const boton = e.target.closest('[data-estado]');
  if (boton) return cambiar({ estado: boton.dataset.estado }, 'Estado actualizado.');
  if (e.target.id === 'guardar-notas') return cambiar({ notas: $('#notas').value }, 'Notas guardadas.');
};

async function cambiar(cambios, aviso) {
  try {
    await api(`/rest/v1/reservas?id=eq.${seleccionado}`, { method: 'PATCH', body: JSON.stringify(cambios) });
    await cargar();
    const m = $('#det-msg');
    if (m) m.textContent = aviso;
  } catch (err) {
    const m = $('#det-msg');
    if (m) m.textContent = err.message;
  }
}

// Disponibilidad: fecha y cantidad de personas
async function revisar(fecha, personas, destino = $('#d-res'), excluir = null) {
  destino.textContent = 'Revisando…';
  try {
    const d = await api('/rest/v1/rpc/disponibilidad', {
      method: 'POST',
      body: JSON.stringify({ p_fecha: fecha, p_personas: Number(personas), p_excluir: excluir })
    });
    destino.innerHTML = `
      <div class="disp ${d.disponible ? 'ok' : 'no'}">${d.disponible ? 'Hay disponibilidad' : 'No hay disponibilidad'} el ${esc(fecha)} para ${esc(personas)} personas</div>
      <ul class="resumen">
        <li>Eventos ese día: <b>${d.eventos}</b> de ${d.max_eventos}</li>
        <li>Personas ya comprometidas: <b>${d.personas_comprometidas}</b> de ${d.max_personas}</li>
      </ul>`;
  } catch (e) {
    destino.textContent = 'No se pudo revisar: ' + e.message;
  }
}

$('#form-disp').onsubmit = e => {
  e.preventDefault();
  revisar($('#d-fecha').value, $('#d-personas').value);
};

if (sesion) iniciar();
</script>
</body>
</html>
